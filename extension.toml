id = "wpf-xaml"
name = "WPF XAML"
description = "WPF XAML support: completion, hover, diagnostics, go to definition, references, rename, formatting and outline via wpf-xaml-ls."
version = "0.1.0"
schema_version = 1
authors = ["Michał Czyż <michal.czyz35@gmail.com>"]
repository = "https://github.com/eRgo35/zed-dotnet"

# Same grammar and commit as Zed's XML extension.
[grammars.xml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-xml"
rev = "5000ae8f22d11fbe93939b05c1e37cf21117162d"
path = "xml"

[language_servers.wpf-xaml-ls]
name = "wpf-xaml-ls"
languages = ["XAML"]
language_ids = { XAML = "xaml" }
